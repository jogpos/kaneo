<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,body { height: 100%; background: #121113; }
    .slide-container {
      width: 1280px;
      height: 720px;
      background: #161618;
      display: flex;
      flex-direction: column;
      padding: 36px;
      font-family: 'Inter', sans-serif;
      color: #EAE9E4;
      position: relative;
      overflow: hidden;
    }
    .motif {
      position: absolute;
      top: 28px;
      right: 28px;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      color: #9C9CA5;
      letter-spacing: 0.4px;
    }
    h2 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h2 i { color: #D65D2E; font-size: 20px; width: 24px; text-align: center; }
    .diagram-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      align-items: center;
      padding-right: 8px;
    }
    .layer {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      width: 100%;
      max-width: 1120px;
    }
    .node {
      background: #222225;
      border: 1px solid #3A3A3F;
      border-radius: 6px;
      padding: 16px 20px;
      min-width: 200px;
      text-align: center;
      box-shadow: 0 0 0 0 rgba(0,0,0,0);
    }
    .node i { color: #D65D2E; margin-bottom: 8px; font-size: 18px; display: block; }
    .node h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .node p { font-family: 'Fira Code', monospace; font-size: 12px; color: #9C9CA5; }
    .arrow {
      height: 20px;
      width: 2px;
      background: #D65D2E;
      margin: 0 auto;
      position: relative;
    }
    .arrow::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: -4px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 7px solid #D65D2E;
    }
    .tech-stack {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 12px 8px;
      border-top: 1px solid #3A3A3F;
      align-items: center;
      flex-wrap: wrap;
    }
    .tech-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      color: #9C9CA5;
    }
    .tech-item span { color: #D65D2E; font-weight: 600; }
    .footer {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      color: #9C9CA5;
      text-align: right;
      margin-top: 6px;
    }

    /* Responsive tightening for internal alignment to ensure everything fits visually */
    @media (min-width: 1280px) {
      .slide-container { letter-spacing: 0.1px; }
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">&gt; kaneo_env :: active</div>
    <h2><i class="fas fa-layer-group" aria-hidden="true"></i> Arhitektura sustava</h2>

    <div class="diagram-container">
      <div class="layer" style="margin-bottom:6px;">
        <div class="node">
          <i class="fas fa-browser" aria-hidden="true"></i>
          <h3>Klijent (Frontend)</h3>
          <p>React + Vite</p>
        </div>
      </div>

      <div class="arrow" aria-hidden="true"></div>

      <div class="layer" style="margin-top:6px;">
        <div class="node">
          <i class="fas fa-server" aria-hidden="true"></i>
          <h3>Hono API (Backend)</h3>
          <p>Node.js Runtime</p>
        </div>

        <div class="node">
          <i class="fas fa-plug" aria-hidden="true"></i>
          <h3>Integracije</h3>
          <p>GitHub / Gitea</p>
        </div>
      </div>

      <div class="arrow" aria-hidden="true"></div>

      <div class="layer" style="margin-top:6px;">
        <div class="node">
          <i class="fas fa-database" aria-hidden="true"></i>
          <h3>PostgreSQL 16</h3>
          <p>Drizzle ORM</p>
        </div>

        <div class="node">
          <i class="fas fa-bolt" aria-hidden="true"></i>
          <h3>Redis (Opcionalno)</h3>
          <p>Live Updates</p>
        </div>
      </div>
    </div>

    <div class="tech-stack">
      <div class="tech-item">Jezik: <span>TypeScript</span></div>
      <div class="tech-item">Stil: <span>Tailwind CSS</span></div>
      <div class="tech-item">Stanje: <span>TanStack Query</span></div>
      <div class="tech-item">Auth: <span>Better Auth</span></div>
    </div>

    <div class="footer">04</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #161618; 
      display: flex; 
      flex-direction: column; 
      padding: 64px;
      font-family: 'Inter', sans-serif;
      color: #EAE9E4;
      border-top: 4px solid #D65D2E;
    }
    .motif {
      position: absolute;
      top: 64px;
      right: 64px;
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      color: #9C9CA5;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .title-group {
      padding-top: 120px;
    }
    h1 {
      font-size: 48px;
      font-weight: 600;
      line-height: 1.2;
      max-width: 800px;
    }
    .summary {
      font-size: 24px;
      color: #9C9CA5;
      margin-top: 24px;
      max-width: 600px;
    }
    .version {
      font-family: 'Fira Code', monospace;
      font-size: 48px;
      color: #D65D2E;
    }
    .footer {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      color: #9C9CA5;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">> kaneo_env :: active</div>
    <div class="content">
      <div class="title-group">
        <h1>Kaneo — lokalno testiranje i arhitektura</h1>
        <p class="summary">Tehnički vodič za postavljanje, provjeru i razumijevanje sustava za nove razvojne inženjere.</p>
      </div>
      <div class="version">v2.46.2</div>
      <div class="footer">01</div>
    </div>
  </div>
</body>
</html>
